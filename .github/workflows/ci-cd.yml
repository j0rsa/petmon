name: CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'migrations/**'
      - 'build.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'frontend/src/**'
      - 'frontend/public/**'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - 'frontend/vite.config.ts'
      - 'frontend/tsconfig*.json'
      - 'frontend/eslint.config.js'
      - 'frontend/.storybook/**'
      - 'Dockerfile'
      - '.github/workflows/**'
      - '.config/**'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'migrations/**'
      - 'build.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'frontend/src/**'
      - 'frontend/public/**'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - 'frontend/vite.config.ts'
      - 'frontend/tsconfig*.json'
      - 'frontend/eslint.config.js'
      - 'frontend/.storybook/**'
      - 'Dockerfile'
      - '.github/workflows/**'
      - '.config/**'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ─────────────────────────────────────────────
  # Stream 1: Frontend build + test
  # ─────────────────────────────────────────────
  frontend:
    name: Frontend (build + test)
    runs-on: ubuntu-latest
    needs: version-check
    if: always() && !failure() && !cancelled()
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Test (Storybook + Vitest)
        run: npx vitest run

      - name: Build
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 1

  # ─────────────────────────────────────────────
  # Stream 1b: Storybook publish (Chromatic)
  # Requires CHROMATIC_PROJECT_TOKEN repo secret.
  # ─────────────────────────────────────────────
  chromatic:
    name: Storybook (Chromatic)
    runs-on: ubuntu-latest
    needs: frontend
    if: always() && needs.frontend.result == 'success'
    permissions:
      contents: read
      pull-requests: write
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Publish to Chromatic
        uses: chromaui/action@v13
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          workingDir: frontend
          buildScriptName: build-storybook
          token: ${{ secrets.GITHUB_TOKEN }}

  # ─────────────────────────────────────────────
  # Version guard (main push only)
  # ─────────────────────────────────────────────
  version-check:
    name: Version check
    runs-on: ubuntu-latest
    # Only meaningful on main pushes; PRs skip so they don't block dev work
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      packages: read
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Extract version from Cargo.toml
        id: ver
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Detected version: v${VERSION}"

      - name: Check tag does not already exist in GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO=$(echo "${{ github.repository }}" | cut -d'/' -f2 | tr '[:upper:]' '[:lower:]')
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://ghcr.io/v2/${OWNER}/${REPO}/manifests/v${VERSION}")
          if [ "$STATUS" = "200" ]; then
            echo "::error::Tag v${VERSION} already exists in GHCR. Bump the version in Cargo.toml before merging."
            exit 1
          fi
          echo "Tag v${VERSION} is free — proceeding."

  # ─────────────────────────────────────────────
  # Stream 2: Backend check (platform-agnostic)
  # ─────────────────────────────────────────────
  backend-check:
    name: Backend (fmt + clippy + audit)
    runs-on: ubuntu-latest
    needs: version-check
    if: always() && !failure() && !cancelled()
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: check

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        env:
          DATABASE_URL: "sqlite::memory:"
        run: cargo clippy --locked -- -D warnings

  # ─────────────────────────────────────────────
  # Stream 2: Backend test (arch-independent)
  # ─────────────────────────────────────────────
  backend-test:
    name: Backend (test)
    runs-on: ubuntu-latest
    needs: backend-check
    permissions:
      checks: write
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: test

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Run tests
        env:
          DATABASE_URL: "sqlite::memory:"
        run: cargo nextest run --locked --profile ci

      - name: Publish test report
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: BE tests
          path: target/nextest/ci/junit.xml
          reporter: java-junit

  # ─────────────────────────────────────────────
  # Stream 2a: Backend x86_64 build
  # ─────────────────────────────────────────────
  backend-amd64:
    name: Backend amd64 (build)
    runs-on: ubuntu-latest
    needs: backend-test
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install musl tools
        run: sudo apt-get install -y musl-tools

      - uses: Swatinem/rust-cache@v2
        with:
          key: amd64

      - name: Build release binary
        env:
          DATABASE_URL: "sqlite::memory:"
        run: cargo build --release --locked --target x86_64-unknown-linux-musl

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: petmon-amd64
          path: target/x86_64-unknown-linux-musl/release/petmon
          retention-days: 1

  # ─────────────────────────────────────────────
  # Stream 2b: Backend aarch64 build
  # ─────────────────────────────────────────────
  backend-arm64:
    name: Backend arm64 (build)
    runs-on: ubuntu-24.04-arm
    needs: backend-test
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl

      - name: Install musl tools
        run: sudo apt-get install -y musl-tools

      - uses: Swatinem/rust-cache@v2
        with:
          key: arm64

      - name: Build release binary
        env:
          DATABASE_URL: "sqlite::memory:"
        run: cargo build --release --locked --target aarch64-unknown-linux-musl

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: petmon-arm64
          path: target/aarch64-unknown-linux-musl/release/petmon
          retention-days: 1

  # ─────────────────────────────────────────────
  # Final: Multi-arch Docker image
  # ─────────────────────────────────────────────
  docker:
    name: Docker multiarch image
    runs-on: ubuntu-latest
    needs: [frontend, backend-amd64, backend-arm64, version-check]
    if: always() && !failure() && !cancelled()
    # Only publish on main branch pushes; PRs still build to validate Dockerfile
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Download amd64 binary
        uses: actions/download-artifact@v4.3.0
        with:
          name: petmon-amd64
          path: dist/amd64

      - name: Download arm64 binary
        uses: actions/download-artifact@v4.3.0
        with:
          name: petmon-arm64
          path: dist/arm64

      - name: Download frontend dist
        uses: actions/download-artifact@v4.3.0
        with:
          name: frontend-dist
          path: dist/frontend

      - name: Make binaries executable
        run: chmod +x dist/amd64/petmon dist/arm64/petmon

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=v${{ needs.version-check.outputs.version }},enable=${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}

      - name: Build and push multiarch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
