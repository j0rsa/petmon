  /nutrition/status:
    get:
      tags:
        - Nutrition Analytics
      summary: Get nutrition status
      x-required-scope: api_read
      description: |
        Returns cumulative nutrition intake and liquid schedule expectations for a pet as of a point in time.
        When `ts` is omitted, the server uses the current time in the configured timezone.
        Cumulative intake includes only records on the local date of `ts` whose `occurred_at` is at or before `ts`.
        Schedule expectations use the active liquid schedule and step up at each window midpoint, matching the cumulative fluid chart.
      parameters:
        - name: pet_id
          in: query
          required: true
          description: Pet UUID
          schema:
            type: string
            format: uuid
        - name: ts
          in: query
          required: false
          description: As-of timestamp for cumulative intake and schedule projection. RFC3339 or naive local `YYYY-MM-DDTHH:MM:SS`. Defaults to now.
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Nutrition status with cumulative intake and schedule expectations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NutritionStatus'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

