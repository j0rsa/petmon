openapi: 3.1.0
info:
  title: PetMon API
  description: Pet monitoring and nutrition tracking API
  version: 1.0.0
  contact:
    name: PetMon Team
  license:
    name: MIT

servers:
  - url: /api/v1
    description: Main API server

security:
  - bearerAuth: []

paths:
  /health:
    get:
      tags:
        - Health
      summary: Health check endpoint
      description: Returns the health status of the API
      security: []
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /info:
    get:
      tags:
        - Health
      summary: Application metadata
      description: Returns build version, git SHA, and whether demo mode is enabled. No authentication required.
      security: []
      responses:
        '200':
          description: Application information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppInfo'

  /auth/info:
    get:
      tags:
        - Authentication
      summary: Get authentication configuration
      description: Returns the current authentication mode and OIDC configuration (if available). No authentication required.
      security: []
      responses:
        '200':
          description: Authentication information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthInfo'

  /auth/me:
    get:
      tags:
        - Authentication
      summary: Get current user identity
      description: Returns information about the authenticated user making the request
      responses:
        '200':
          description: Current user information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/sign-out:
    post:
      tags:
        - Authentication
      summary: Sign out of the current session
      description: |
        Ends the current session. When authenticated with a long-lived API token,
        the token is permanently deleted from the server so it cannot be reused.
        OIDC sessions are unaffected (the client clears its stored token).
      responses:
        '204':
          description: Signed out successfully
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: API token not found (api_token sessions only)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /pets:
    get:
      tags:
        - Pets
      summary: List all pets
      x-required-scope: api_read
      description: Retrieve a list of all pets in the system
      responses:
        '200':
          description: List of pets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pet'
        '403':
          $ref: '#/components/responses/Forbidden'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags:
        - Pets
      summary: Create a new pet
      x-required-scope: api_write
      description: Create a new pet record with the provided information
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePet'
      responses:
        '201':
          description: Pet created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /pets/{id}:
    get:
      tags:
        - Pets
      summary: Get a pet by ID
      x-required-scope: api_read
      description: Retrieve a specific pet by its UUID
      parameters:
        - name: id
          in: path
          required: true
          description: Pet UUID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Pet information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
        '403':
          $ref: '#/components/responses/Forbidden'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      tags:
        - Pets
      summary: Update a pet
      x-required-scope: api_write
      description: Update one or more fields of an existing pet
      parameters:
        - name: id
          in: path
          required: true
          description: Pet UUID
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePet'
      responses:
        '200':
          description: Pet updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags:
        - Pets
      summary: Delete a pet
      x-required-scope: api_write
      description: Delete a pet by its UUID
      parameters:
        - name: id
          in: path
          required: true
          description: Pet UUID
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Pet deleted successfully
        '403':
          $ref: '#/components/responses/Forbidden'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /days/{date}:
    get:
      tags:
        - Days
      summary: Get day summary
      x-required-scope: api_read
      description: Retrieve nutrition records and summary for a specific date. Optionally filter by pet.
      parameters:
        - name: date
          in: path
          required: true
          description: Date in YYYY-MM-DD format
          schema:
            type: string
            format: date
        - name: pet_id
          in: query
          required: false
          description: Filter by pet UUID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Day summary with nutrition records and totals
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NutritionDaySummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /days/{date}/note:
    patch:
      tags:
        - Days
      summary: Update day note
      x-required-scope: api_write
      description: Update or create a note for a specific day. Optionally scoped to a pet.
      parameters:
        - name: date
          in: path
          required: true
          description: Date in YYYY-MM-DD format
          schema:
            type: string
            format: date
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - note
              properties:
                note:
                  type: string
                  description: Note text
                pet_id:
                  type: string
                  format: uuid
                  description: Optional pet UUID to scope the note
      responses:
        '200':
          description: Note updated successfully
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /notes/{date}:
    get:
      tags:
        - Notes
      summary: Get day note
      x-required-scope: api_read
      description: Retrieve the note for a specific date. Optionally filter by pet.
      parameters:
        - name: date
          in: path
          required: true
          description: Date in YYYY-MM-DD format
          schema:
            type: string
            format: date
        - name: pet_id
          in: query
          required: false
          description: Filter by pet UUID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Day note
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DayNote'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '401':
          $ref: '#/components/responses/Unauthorized'

    patch:
      tags:
        - Notes
      summary: Update or create day note
      x-required-scope: api_write
      description: Update or create a note for a specific date. Optionally scoped to a pet.
      parameters:
        - name: date
          in: path
          required: true
          description: Date in YYYY-MM-DD format
          schema:
            type: string
            format: date
        - name: pet_id
          in: query
          required: false
          description: Filter by pet UUID
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - note
              properties:
                note:
                  type: string
                  description: Note text
      responses:
        '200':
          description: Note created or updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DayNote'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /notifications:
    get:
      tags:
        - Notifications
      summary: List notifications
      x-required-scope: api_read
      description: Returns global notification messages with read state for the current authenticated reader.
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, format: int64, minimum: 1, maximum: 200, default: 50 }
        - name: unread_only
          in: query
          required: false
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Notification list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NotificationView'
        '403':
          $ref: '#/components/responses/Forbidden'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /notifications/unread-count:
    get:
      tags:
        - Notifications
      summary: Get unread notification count
      x-required-scope: api_read
      responses:
        '200':
          description: Unread count for the current reader
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationUnreadCount'
        '403':
          $ref: '#/components/responses/Forbidden'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /notifications/read-all:
    post:
      tags:
        - Notifications
      summary: Mark all notifications read
      x-required-scope: api_write
      responses:
        '200':
          description: Updated unread count
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationUnreadCount'
        '403':
          $ref: '#/components/responses/Forbidden'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /push/config:
    get:
      tags:
        - Push
      summary: Get web push configuration
      x-required-scope: api_read
      responses:
        '200':
          description: VAPID public key and availability
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PushConfigPublic'
        '403':
          $ref: '#/components/responses/Forbidden'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /push/subscribe:
    post:
      tags:
        - Push
      summary: Register a browser push subscription
      x-required-scope: api_write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PushSubscribeRequest'
      responses:
        '204':
          description: Subscription stored
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /push/unsubscribe:
    post:
      tags:
        - Push
      summary: Remove a browser push subscription
      x-required-scope: api_write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                endpoint:
                  type: string
              required:
                - endpoint
      responses:
        '204':
          description: Subscription removed
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /push/test:
    post:
      tags:
        - Push
      summary: Send a test push notification
      x-required-scope: api_write
      description: >
        Sends a test notification to a single push subscription identified by
        `endpoint` (the requesting browser/device). Does not broadcast to other
        devices.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PushTestRequest'
      responses:
        '200':
          description: Delivery summary for the targeted device
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PushTestResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /notifications/dismiss-all:
    post:
      tags:
        - Notifications
      summary: Dismiss all notifications
      x-required-scope: api_write
      description: Permanently deletes all notifications from the database for every reader.
      responses:
        '200':
          description: Unread count after dismissal (always zero)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationUnreadCount'
        '403':
          $ref: '#/components/responses/Forbidden'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /notifications/{id}/read:
    post:
      tags:
        - Notifications
      summary: Mark one notification read
      x-required-scope: api_write
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: Marked read
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /me/settings/{key}:
    get:
      tags:
        - Settings
      summary: Get per-user settings
      x-required-scope: api_read
      description: Retrieve preferences for the authenticated user (display formatting, widget configs, etc.)
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
            enum:
              - display
              - nutrition_calendar
              - cumulative_fluid_chart
      responses:
        '200':
          description: User settings
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/UserDisplaySettings'
                  - $ref: '#/components/schemas/NutritionCalendarSettings'
                  - $ref: '#/components/schemas/CumulativeFluidChartSettings'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags:
        - Settings
      summary: Update per-user settings
      x-required-scope: api_write
      description: Partially update preferences for the authenticated user. Omitted fields keep their existing values.
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
            enum:
              - display
              - nutrition_calendar
              - cumulative_fluid_chart
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/UpdateUserDisplaySettings'
                - $ref: '#/components/schemas/UpdateNutritionCalendarSettings'
                - $ref: '#/components/schemas/UpdateCumulativeFluidChartSettings'
      responses:
        '200':
          description: User settings updated
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/UserDisplaySettings'
                  - $ref: '#/components/schemas/NutritionCalendarSettings'
                  - $ref: '#/components/schemas/CumulativeFluidChartSettings'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /settings/oidc:
    get:
      tags:
        - Settings
      summary: Get OIDC configuration
      x-required-scope: api_read
      description: Retrieve the current OIDC configuration (client secret is never exposed)
      responses:
        '200':
          description: OIDC configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OidcConfigPublic'
        '403':
          $ref: '#/components/responses/Forbidden'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags:
        - Settings
      summary: Update OIDC configuration
      x-required-scope: api_write
      description: Update OIDC settings. Omitting client_secret keeps the existing value.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOidcConfig'
      responses:
        '200':
          description: OIDC configuration updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OidcConfigPublic'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /settings/telegram:
    get:
      tags:
        - Settings
      summary: Get Telegram configuration
      x-required-scope: api_read
      description: Retrieve the current Telegram configuration (bot token is never exposed)
      responses:
        '200':
          description: Telegram configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelegramConfigPublic'
        '403':
          $ref: '#/components/responses/Forbidden'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags:
        - Settings
      summary: Update Telegram configuration
      x-required-scope: api_write
      description: Update Telegram settings. Omitting bot_token keeps the existing value.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTelegramConfig'
      responses:
        '200':
          description: Telegram configuration updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelegramConfigPublic'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api-tokens:
    get:
      tags:
        - API Tokens
      summary: List API tokens
      x-required-scope: api_read
      description: List all API tokens (token hashes are never exposed)
      responses:
        '200':
          description: List of API tokens
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApiTokenPublic'
        '403':
          $ref: '#/components/responses/Forbidden'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags:
        - API Tokens
      summary: Create API token
      x-required-scope: api_write
      description: Create a new API token. Can only be created by OIDC-authenticated users, not by other API tokens.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApiToken'
      responses:
        '201':
          description: API token created (includes raw token, shown only once)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiTokenCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api-tokens/{id}/activate:
    post:
      tags:
        - API Tokens
      summary: Activate API token
      x-required-scope: api_write
      description: Re-activate a previously deactivated API token
      parameters:
        - name: id
          in: path
          required: true
          description: API token ID
          schema:
            type: string
      responses:
        '204':
          description: API token activated
        '403':
          $ref: '#/components/responses/Forbidden'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api-tokens/{id}:
    delete:
      tags:
        - API Tokens
      summary: Deactivate API token
      x-required-scope: api_write
      description: Deactivate an API token by ID
      parameters:
        - name: id
          in: path
          required: true
          description: API token ID
          schema:
            type: string
      responses:
        '204':
          description: API token deactivated
        '403':
          $ref: '#/components/responses/Forbidden'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api-tokens/{id}/scopes:
    patch:
      tags:
        - API Tokens
      summary: Update token scopes
      x-required-scope: api_write
      description: Replace the scope set on an existing token. Valid scopes are all, api_read, api_write, mcp.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateApiTokenScopes'
      responses:
        '200':
          description: Updated token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiTokenPublic'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api-tokens/{id}/permanent:
    delete:
      tags:
        - API Tokens
      summary: Permanently delete API token
      x-required-scope: api_write
      description: Permanently delete an inactive API token. The token must be deactivated first.
      parameters:
        - name: id
          in: path
          required: true
          description: API token ID
          schema:
            type: string
      responses:
        '204':
          description: API token permanently deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /elimination/records:
    get:
      tags:
        - Elimination Records
      summary: List elimination records
      x-required-scope: api_read
      description: Retrieve elimination records with optional filtering
      parameters:
        - name: pet_id
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: date
          in: query
          required: false
          schema: { type: string, format: date }
        - name: date_from
          in: query
          required: false
          schema: { type: string, format: date }
        - name: date_to
          in: query
          required: false
          schema: { type: string, format: date }
        - name: event_type
          in: query
          required: false
          schema: { $ref: '#/components/schemas/EliminationEventType' }
        - name: limit
          in: query
          required: false
          schema: { type: integer, format: int64, minimum: 1 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, format: int64, minimum: 0 }
      responses:
        '200':
          description: List of elimination records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EliminationRecord'
        '403':
          $ref: '#/components/responses/Forbidden'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags:
        - Elimination Records
      summary: Create elimination record
      x-required-scope: api_write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEliminationRecord'
      responses:
        '201':
          description: Record created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EliminationRecord'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '401':
          $ref: '#/components/responses/Unauthorized'

