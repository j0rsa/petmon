openapi: 3.1.0
info:
  title: PetMon API
  description: Pet monitoring and nutrition tracking API
  version: 1.0.0
  contact:
    name: PetMon Team
  license:
    name: MIT

servers:
  - url: /api/v1
    description: Main API server

security:
  - bearerAuth: []

paths:
  /health:
    get:
      tags:
        - Health
      summary: Health check endpoint
      description: Returns the health status of the API
      security: []
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /auth/info:
    get:
      tags:
        - Authentication
      summary: Get authentication configuration
      description: Returns the current authentication mode and OIDC configuration (if available). No authentication required.
      security: []
      responses:
        '200':
          description: Authentication information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthInfo'

  /auth/me:
    get:
      tags:
        - Authentication
      summary: Get current user identity
      description: Returns information about the authenticated user making the request
      responses:
        '200':
          description: Current user information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /pets:
    get:
      tags:
        - Pets
      summary: List all pets
      description: Retrieve a list of all pets in the system
      responses:
        '200':
          description: List of pets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pet'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags:
        - Pets
      summary: Create a new pet
      description: Create a new pet record with the provided information
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePet'
      responses:
        '201':
          description: Pet created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /pets/{id}:
    get:
      tags:
        - Pets
      summary: Get a pet by ID
      description: Retrieve a specific pet by its UUID
      parameters:
        - name: id
          in: path
          required: true
          description: Pet UUID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Pet information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      tags:
        - Pets
      summary: Update a pet
      description: Update one or more fields of an existing pet
      parameters:
        - name: id
          in: path
          required: true
          description: Pet UUID
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePet'
      responses:
        '200':
          description: Pet updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags:
        - Pets
      summary: Delete a pet
      description: Delete a pet by its UUID
      parameters:
        - name: id
          in: path
          required: true
          description: Pet UUID
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Pet deleted successfully
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /days/{date}:
    get:
      tags:
        - Days
      summary: Get day summary
      description: Retrieve nutrition records and summary for a specific date. Optionally filter by pet.
      parameters:
        - name: date
          in: path
          required: true
          description: Date in YYYY-MM-DD format
          schema:
            type: string
            format: date
        - name: pet_id
          in: query
          required: false
          description: Filter by pet UUID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Day summary with nutrition records and totals
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NutritionDaySummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /days/{date}/note:
    patch:
      tags:
        - Days
      summary: Update day note
      description: Update or create a note for a specific day. Optionally scoped to a pet.
      parameters:
        - name: date
          in: path
          required: true
          description: Date in YYYY-MM-DD format
          schema:
            type: string
            format: date
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - note
              properties:
                note:
                  type: string
                  description: Note text
                pet_id:
                  type: string
                  format: uuid
                  description: Optional pet UUID to scope the note
      responses:
        '200':
          description: Note updated successfully
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /notes/{date}:
    get:
      tags:
        - Notes
      summary: Get day note
      description: Retrieve the note for a specific date. Optionally filter by pet.
      parameters:
        - name: date
          in: path
          required: true
          description: Date in YYYY-MM-DD format
          schema:
            type: string
            format: date
        - name: pet_id
          in: query
          required: false
          description: Filter by pet UUID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Day note
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DayNote'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

    patch:
      tags:
        - Notes
      summary: Update or create day note
      description: Update or create a note for a specific date. Optionally scoped to a pet.
      parameters:
        - name: date
          in: path
          required: true
          description: Date in YYYY-MM-DD format
          schema:
            type: string
            format: date
        - name: pet_id
          in: query
          required: false
          description: Filter by pet UUID
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - note
              properties:
                note:
                  type: string
                  description: Note text
      responses:
        '200':
          description: Note created or updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DayNote'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /settings/display:
    get:
      tags:
        - Settings
      summary: Get display settings
      description: Retrieve display preferences (time format, date format, water card visibility)
      responses:
        '200':
          description: Display settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DisplaySettings'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags:
        - Settings
      summary: Update display settings
      description: Update display preferences. Omitted fields keep their existing values.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDisplaySettings'
      responses:
        '200':
          description: Display settings updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DisplaySettings'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /settings/oidc:
    get:
      tags:
        - Settings
      summary: Get OIDC configuration
      description: Retrieve the current OIDC configuration (client secret is never exposed)
      responses:
        '200':
          description: OIDC configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OidcConfigPublic'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags:
        - Settings
      summary: Update OIDC configuration
      description: Update OIDC settings. Omitting client_secret keeps the existing value.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOidcConfig'
      responses:
        '200':
          description: OIDC configuration updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OidcConfigPublic'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /settings/telegram:
    get:
      tags:
        - Settings
      summary: Get Telegram configuration
      description: Retrieve the current Telegram configuration (bot token is never exposed)
      responses:
        '200':
          description: Telegram configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelegramConfigPublic'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags:
        - Settings
      summary: Update Telegram configuration
      description: Update Telegram settings. Omitting bot_token keeps the existing value.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTelegramConfig'
      responses:
        '200':
          description: Telegram configuration updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelegramConfigPublic'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api-tokens:
    get:
      tags:
        - API Tokens
      summary: List API tokens
      description: List all API tokens (token hashes are never exposed)
      responses:
        '200':
          description: List of API tokens
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApiTokenPublic'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags:
        - API Tokens
      summary: Create API token
      description: Create a new API token. Can only be created by OIDC-authenticated users, not by other API tokens.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApiToken'
      responses:
        '201':
          description: API token created (includes raw token, shown only once)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiTokenCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api-tokens/{id}/activate:
    post:
      tags:
        - API Tokens
      summary: Activate API token
      description: Re-activate a previously deactivated API token
      parameters:
        - name: id
          in: path
          required: true
          description: API token ID
          schema:
            type: string
      responses:
        '204':
          description: API token activated
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api-tokens/{id}:
    delete:
      tags:
        - API Tokens
      summary: Deactivate API token
      description: Deactivate an API token by ID
      parameters:
        - name: id
          in: path
          required: true
          description: API token ID
          schema:
            type: string
      responses:
        '204':
          description: API token deactivated
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api-tokens/{id}/permanent:
    delete:
      tags:
        - API Tokens
      summary: Permanently delete API token
      description: Permanently delete an inactive API token. The token must be deactivated first.
      parameters:
        - name: id
          in: path
          required: true
          description: API token ID
          schema:
            type: string
      responses:
        '204':
          description: API token permanently deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /elimination/records:
    get:
      tags:
        - Elimination Records
      summary: List elimination records
      description: Retrieve elimination records with optional filtering
      parameters:
        - name: pet_id
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: date
          in: query
          required: false
          schema: { type: string, format: date }
        - name: date_from
          in: query
          required: false
          schema: { type: string, format: date }
        - name: date_to
          in: query
          required: false
          schema: { type: string, format: date }
        - name: event_type
          in: query
          required: false
          schema: { $ref: '#/components/schemas/EliminationEventType' }
        - name: limit
          in: query
          required: false
          schema: { type: integer, format: int64, minimum: 1 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, format: int64, minimum: 0 }
      responses:
        '200':
          description: List of elimination records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EliminationRecord'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags:
        - Elimination Records
      summary: Create elimination record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEliminationRecord'
      responses:
        '201':
          description: Record created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EliminationRecord'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /elimination/records/with-weight:
    post:
      tags:
        - Elimination Records
      summary: Create elimination record and weight measurement together
      description: >
        Submits a toileting event and a weight measurement in a single atomic request.
        Both records share the same resolved timestamp. The pet's current weight is
        updated as a side-effect, identical to a standalone weight record creation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEliminationWithWeight'
      responses:
        '201':
          description: Both records created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EliminationWithWeightCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /elimination/records/{id}:
    get:
      tags:
        - Elimination Records
      summary: Get elimination record by ID
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Elimination record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EliminationRecord'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      tags:
        - Elimination Records
      summary: Update elimination record
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEliminationRecord'
      responses:
        '200':
          description: Record updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EliminationRecord'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags:
        - Elimination Records
      summary: Delete elimination record
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '204':
          description: Record deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /elimination/analytics/daily-summaries:
    get:
      tags:
        - Elimination Analytics
      summary: Get daily elimination summaries
      parameters:
        - name: date_from
          in: query
          required: true
          schema: { type: string, format: date }
        - name: date_to
          in: query
          required: true
          schema: { type: string, format: date }
        - name: pet_id
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Daily summaries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EliminationDailySummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /elimination/analytics/range-summary:
    get:
      tags:
        - Elimination Analytics
      summary: Get elimination range summary with percentiles
      parameters:
        - name: date_from
          in: query
          required: true
          schema: { type: string, format: date }
        - name: date_to
          in: query
          required: true
          schema: { type: string, format: date }
        - name: pet_id
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Range summary with avg/p50/p90/p99 per day
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EliminationRangeSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /health/weight:
    get:
      tags:
        - Weight Records
      summary: List weight records
      parameters:
        - name: pet_id
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: date_from
          in: query
          required: false
          schema: { type: string, format: date }
        - name: date_to
          in: query
          required: false
          schema: { type: string, format: date }
        - name: limit
          in: query
          required: false
          schema: { type: integer, format: int64, minimum: 1 }
      responses:
        '200':
          description: List of weight records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WeightRecord'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags:
        - Weight Records
      summary: Create weight record
      description: Creates a weight record and updates the pet's current weight_kg.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWeightRecord'
      responses:
        '201':
          description: Weight record created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeightRecord'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /health/weight/stats:
    get:
      tags:
        - Weight Records
      summary: Get weight stats for a date range
      description: Returns the latest weight, 30-day average, and record count. Used for overview and health-context comparisons.
      parameters:
        - name: pet_id
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: date_from
          in: query
          required: true
          schema: { type: string, format: date }
        - name: date_to
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        '200':
          description: Weight stats
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeightStats'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /health/weight/summary:
    get:
      tags:
        - Weight Records
      summary: Get aggregated weight history
      description: |
        Returns weight records bucketed by granularity. Use this for charts with large datasets.
        - `raw`: one bucket per individual measurement (for short windows, ≤30d)
        - `daily`: one bucket per calendar day with avg/min/max (for medium windows, ≤90d)
        - `weekly`: one bucket per week (Monday-aligned) with avg/min/max (for long windows)
      parameters:
        - name: pet_id
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: date_from
          in: query
          required: false
          schema: { type: string, format: date }
        - name: date_to
          in: query
          required: true
          schema: { type: string, format: date }
        - name: granularity
          in: query
          required: false
          schema: { type: string, enum: [raw, daily, weekly], default: daily }
      responses:
        '200':
          description: List of weight summary buckets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WeightSummaryBucket'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /health/weight/{id}:
    delete:
      tags:
        - Weight Records
      summary: Delete weight record
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '204':
          description: Weight record deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /nutrition/records:
    get:
      tags:
        - Nutrition Records
      summary: List nutrition records
      description: Retrieve nutrition records with optional filtering
      parameters:
        - name: pet_id
          in: query
          required: false
          description: Filter by pet UUID
          schema:
            type: string
            format: uuid
        - name: date
          in: query
          required: false
          description: Filter by specific date (YYYY-MM-DD)
          schema:
            type: string
            format: date
        - name: date_from
          in: query
          required: false
          description: Filter records from this date (YYYY-MM-DD, inclusive)
          schema:
            type: string
            format: date
        - name: date_to
          in: query
          required: false
          description: Filter records until this date (YYYY-MM-DD, inclusive)
          schema:
            type: string
            format: date
        - name: category
          in: query
          required: false
          description: Filter by nutrition category
          schema:
            $ref: '#/components/schemas/NutritionCategory'
        - name: limit
          in: query
          required: false
          description: Maximum number of records to return
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: offset
          in: query
          required: false
          description: Pagination offset
          schema:
            type: integer
            format: int64
            minimum: 0
      responses:
        '200':
          description: List of nutrition records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NutritionRecord'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags:
        - Nutrition Records
      summary: Create nutrition record
      description: Create a single nutrition record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateNutritionRecord'
      responses:
        '201':
          description: Nutrition record created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NutritionRecord'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /nutrition/records/batch:
    post:
      tags:
        - Nutrition Records
      summary: Create multiple nutrition records
      description: Create multiple nutrition records in a single request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - records
              properties:
                records:
                  type: array
