        local_date: { type: string, format: date }
        note: { type: string }
        source_type: { type: string }
      required: [pet_id, medication_id]

    DailyMedAssignment:
      type: object
      properties:
        medication: { $ref: '#/components/schemas/Medication' }
        assignment: { $ref: '#/components/schemas/MedAssignment' }
        intakes:
          type: array
          items: { $ref: '#/components/schemas/MedIntakeRecord' }
      required: [medication, assignment, intakes]

    WeightSummaryBucket:
      type: object
      description: Aggregated weight data for a time bucket
      required: [bucket, avg_kg, min_kg, max_kg, count]
      properties:
        bucket:
          type: string
          description: Bucket identifier — ISO datetime for raw, YYYY-MM-DD for daily/weekly
        avg_kg:
          type: number
          format: double
        min_kg:
          type: number
          format: double
        max_kg:
          type: number
          format: double
        count:
          type: integer
          format: int64

    WeightStats:
      type: object
      properties:
        latest_kg:
          type: number
          format: double
          nullable: true
          description: Most recent weight measurement for the pet
        latest_date:
          type: string
          format: date
          nullable: true
          description: Date of the most recent measurement
        avg_kg:
          type: number
          format: double
          nullable: true
          description: Average weight within the requested date window
        count:
          type: integer
          format: int64
          description: Number of measurements within the date window
      required:
        - count

