components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        Bearer authentication with either:
        - OIDC JWT token (format: standard JWT) — full access, no scope restrictions
        - API token with `pm_api_` prefix — access controlled by the token's scope set

        **API token scopes:**
        | Scope | Access granted |
        |---|---|
        | `all` | Full access — equivalent to OIDC |
        | `api_read` | All GET endpoints |
        | `api_write` | All POST / PATCH / DELETE endpoints |
        | `mcp` | MCP tool endpoint (`/mcp`) |

        A token may hold multiple scopes (e.g. `["api_read", "mcp"]`).
        The scope required by each endpoint is shown in the `x-required-scope` field.

  responses:
    BadRequest:
      description: Invalid request parameters or body
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Unauthorized:
      description: Authentication required or invalid credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Forbidden:
      description: Token does not have the required scope for this endpoint
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    AppInfo:
      type: object
      required: [version, git_sha, demo_mode]
      properties:
        version:
          type: string
          example: "0.17.0"
        git_sha:
          type: string
          example: "abc1234"
        demo_mode:
          type: boolean
          description: True when the server started with DEMO_MODE (demo seed + UI banner).
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: Error message
      required:
        - error

    AuthMode:
      type: string
      enum:
        - dev
        - oidc
        - unconfigured
      description: Current authentication mode

    AuthInfo:
      type: object
      properties:
        mode:
          $ref: '#/components/schemas/AuthMode'
        authorization_endpoint:
          type: string
          nullable: true
          description: OAuth2 authorization endpoint URL
        client_id:
          type: string
          nullable: true
          description: OAuth2 client ID for the frontend
        token_endpoint:
          type: string
          nullable: true
          description: OAuth2 token endpoint URL
        end_session_endpoint:
          type: string
          nullable: true
          description: OIDC RP-initiated logout (end_session) endpoint URL
      required:
        - mode

    MeResponse:
      type: object
      properties:
        subject:
          type: string
          description: User subject identifier
        email:
          type: string
          nullable: true
          description: User email address
        name:
          type: string
          nullable: true
          description: User full name
        display_name:
          type: string
          description: Display name (name or email or subject)
        kind:
          type: string
          enum:
            - oidc
            - api_token
            - dev
          description: Authentication method used
        scopes:
          type: array
          items:
            type: string
          description: Granted scopes. Empty means full access (no restriction).
        token_created_by:
          type: string
          nullable: true
          description: Creator display name for the API token session (api_token kind only)
      required:
        - subject
        - display_name
        - kind
        - scopes

    PetSpecies:
      type: string
      enum:
        - cat
        - dog
        - bunny
        - parrot
        - other
      description: Pet species

    PetStatus:
      type: string
      enum:
        - active
        - archived
      description: Pet status

    Pet:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Pet UUID
        name:
          type: string
          description: Pet name
        species:
          $ref: '#/components/schemas/PetSpecies'
        status:
          $ref: '#/components/schemas/PetStatus'
        breed:
          type: string
          nullable: true
          description: Pet breed
        birth_date:
          type: string
          nullable: true
          description: Pet birth date (YYYY-MM-DD)
        blood_type:
          type: string
          nullable: true
          description: Pet blood type
        color:
          type: string
          nullable: true
          description: Pet color/markings
        feeding_notes:
          type: string
          nullable: true
          description: Feeding instructions and notes
        telegram_chat_id:
          type: string
          nullable: true
          description: Telegram chat ID for notifications
        telegram_thread_id:
          type: string
          nullable: true
          description: Telegram thread ID for topic replies
        elimination_auto_categorize_by_duration:
          type: boolean
          description: When enabled, general elimination records with duration are auto-tagged as wee or poop based on this pet's historical duration buckets
        created_at:
          type: string
          format: date-time
          description: Record creation timestamp (RFC3339)
        updated_at:
          type: string
          format: date-time
          description: Record last update timestamp (RFC3339)
      required:
        - id
        - name
        - species
        - status
        - elimination_auto_categorize_by_duration
        - created_at
        - updated_at

    CreatePet:
      type: object
      properties:
        name:
          type: string
          description: Pet name
        species:
          $ref: '#/components/schemas/PetSpecies'
        status:
          $ref: '#/components/schemas/PetStatus'
        breed:
          type: string
          nullable: true
        birth_date:
          type: string
          nullable: true
          format: date
        blood_type:
          type: string
          nullable: true
        color:
          type: string
          nullable: true
        feeding_notes:
          type: string
          nullable: true
        telegram_chat_id:
          type: string
          nullable: true
        telegram_thread_id:
          type: string
          nullable: true
        elimination_auto_categorize_by_duration:
          type: boolean
          description: Enable duration-based auto-categorization for general elimination records
      required:
        - name

    UpdatePet:
      type: object
      properties:
        name:
          type: string
          nullable: true
        species:
          $ref: '#/components/schemas/PetSpecies'
        status:
          $ref: '#/components/schemas/PetStatus'
        breed:
          type: string
          nullable: true
        birth_date:
          type: string
          nullable: true
          format: date
        blood_type:
          type: string
          nullable: true
        color:
          type: string
          nullable: true
        feeding_notes:
          type: string
          nullable: true
        telegram_chat_id:
          type: string
          nullable: true
        telegram_thread_id:
          type: string
          nullable: true
        elimination_auto_categorize_by_duration:
          type: boolean
          description: Enable duration-based auto-categorization for general elimination records

    NotificationView:
      type: object
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
        title:
          type: string
        body:
          type: string
          nullable: true
        link_path:
          type: string
          description: In-app route path, e.g. /elimination/2026-06-02
        link_hash:
          type: string
          nullable: true
          description: Optional hash target within the page, e.g. record-{id}
        pet_id:
          type: string
          format: uuid
          nullable: true
        pet_name:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        read:
          type: boolean
          description: Whether the current authenticated reader has marked this notification read
      required:
        - id
        - kind
        - title
        - link_path
        - created_at
        - read

    NotificationUnreadCount:
      type: object
      properties:
        count:
          type: integer
          format: int64
      required:
        - count

    PushConfigPublic:
      type: object
      properties:
        enabled:
          type: boolean
        public_key:
          type: string
          nullable: true
      required:
        - enabled

    PushSubscribeRequest:
      type: object
      properties:
        endpoint:
          type: string
        keys:
          type: object
          properties:
            p256dh:
              type: string
            auth:
              type: string
          required:
            - p256dh
            - auth
      required:
        - endpoint
        - keys

    PushTestRequest:
      type: object
      properties:
        endpoint:
          type: string
          description: Push subscription endpoint of the device that should receive the test
      required:
        - endpoint

    PushTestResult:
      type: object
      properties:
        sent:
          type: integer
          format: int32
        failed:
          type: integer
          format: int32
        error:
          type: string
          nullable: true
          description: Present when delivery to the targeted device failed
      required:
        - sent
        - failed

    DayNote:
      type: object
      properties:
        date:
          type: string
          format: date
          description: Date of the note
        pet_id:
          type: string
          format: uuid
          nullable: true
          description: Associated pet UUID, if any
        note:
          type: string
          description: Note text
      required:
        - date
        - note

    NutritionCategory:
      type: string
      enum:
        - wet_food
        - dry_food
        - water
        - liquids
      description: Category of nutrition intake

    NutritionRecord:
      type: object
      properties:
        id:
          type: string
          description: Record ID
        pet_id:
          type: string
          format: uuid
          description: Pet UUID
        occurred_at:
          type: string
          format: date-time
          description: When the intake occurred (RFC3339)
        local_date:
          type: string
          format: date
          description: Local date of the occurrence
        category:
          $ref: '#/components/schemas/NutritionCategory'
        amount:
          type: number
          format: double
          description: Amount consumed
        unit:
          type: string
          nullable: true
          description: Unit of measurement (ml, g, etc.)
        note:
          type: string
          nullable: true
          description: Optional note about this intake (food type, medication, etc.)
        source_type:
          type: string
          description: Source of the record (e.g., manual, telegram)
        created_at:
          type: string
          format: date-time
          description: Record creation timestamp (RFC3339)
        updated_at:
          type: string
          format: date-time
          description: Record last update timestamp (RFC3339)
      required:
        - id
        - pet_id
        - occurred_at
        - local_date
        - category
        - amount
        - source_type
        - created_at
        - updated_at

    CreateNutritionRecord:
      type: object
      properties:
        pet_id:
          type: string
          format: uuid
          description: Pet UUID
        occurred_at:
          type: string
          format: date-time
          description: When the intake occurred (RFC3339)
        local_date:
          type: string
          format: date
          nullable: true
          description: Local date (auto-derived if not provided)
        category:
          $ref: '#/components/schemas/NutritionCategory'
        amount:
          type: number
          format: double
          description: Amount consumed
        unit:
          type: string
          nullable: true
          description: Unit of measurement
        note:
          type: string
          nullable: true
          description: Optional note about this intake
        source_type:
          type: string
          nullable: true
          description: Source of the record (defaults to manual)
      required:
        - pet_id
        - occurred_at
        - category
        - amount

    UpdateNutritionRecord:
      type: object
      properties:
        occurred_at:
          type: string
          format: date-time
          nullable: true
        local_date:
          type: string
          format: date
          nullable: true
        category:
          $ref: '#/components/schemas/NutritionCategory'
        amount:
          type: number
          format: double
          nullable: true
        unit:
          type: string
          nullable: true
        note:
          type: string
          nullable: true

    NutritionScheduleWindow:
      type: object
      properties:
        from:
          type: string
          description: Window start time (HH:MM)
        to:
          type: string
          description: Window end time (HH:MM)
        min:
          type: number
          format: double
          description: Minimum amount for this window
        max:
          type: number
          format: double
          description: Maximum amount for this window
        note:
          type: string
          nullable: true
          description: Optional note for this window
      required:
        - from
        - to
        - min
        - max

    NutritionScheduleRules:
      type: object
      description: Window-based feeding schedule. Daily targets are derived by summing window min/max values. Time-of-day expectations are available from GET /nutrition/status.
      properties:
        type:
          type: string
          enum: [liquid, food]
          description: Schedule type (liquids in ml or food in g)
        windows:
          type: array
          items:
            $ref: '#/components/schemas/NutritionScheduleWindow'
      required:
        - type
        - windows

    NutritionSchedule:
      type: object
      properties:
        id:
          type: string
          description: Schedule ID
        pet_id:
          type: string
          format: uuid
          description: Pet UUID
        name:
          type: string
          description: Schedule name
        active:
          type: boolean
          description: Whether the schedule is active
        rules_json:
          type: string
          description: JSON-serialized window-based schedule rules
        created_at:
          type: string
          format: date-time
          description: Record creation timestamp (RFC3339)
        updated_at:
          type: string
          format: date-time
          description: Record last update timestamp (RFC3339)
      required:
        - id
        - pet_id
        - name
        - active
        - rules_json
        - created_at
        - updated_at

    CreateNutritionSchedule:
      type: object
      properties:
        pet_id:
          type: string
          format: uuid
          description: Pet UUID
        name:
          type: string
          description: Schedule name
        active:
          type: boolean
          nullable: true
          description: Active status (defaults to true)
        rules:
          nullable: true
          description: Window-based schedule rules
          $ref: '#/components/schemas/NutritionScheduleRules'
      required:
        - pet_id
        - name

    UpdateNutritionSchedule:
      type: object
      properties:
        name:
          type: string
          nullable: true
        active:
          type: boolean
          nullable: true
        rules:
          nullable: true
          description: Window-based schedule rules
          $ref: '#/components/schemas/NutritionScheduleRules'

    NutritionDailyTotal:
      type: object
      properties:
        local_date:
          type: string
          format: date
          description: Date of the totals
        pet_id:
          type: string
          format: uuid
          description: Pet UUID
        category:
          type: string
          description: Nutrition category
        total_amount:
          type: number
          format: double
          description: Total amount for the day
        record_count:
          type: integer
          format: int64
          description: Number of records contributing to this total
      required:
        - local_date
        - pet_id
        - category
        - total_amount
        - record_count

    NutritionDaySummary:
      type: object
      properties:
        local_date:
          type: string
          format: date
          description: Date of the summary
        pet_id:
          type: string
          format: uuid
          nullable: true
          description: Pet UUID (if filtered)
        records:
          type: array
          items:
            $ref: '#/components/schemas/NutritionRecord'
          description: Nutrition records for the day
        totals_by_category:
          type: object
          additionalProperties:
            type: number
            format: double
          description: Total amounts by category
        note:
          type: string
          nullable: true
          description: Optional day note

    NutritionStatus:
      type: object
      properties:
        pet_id:
          type: string
          format: uuid
          description: Pet UUID
        local_date:
          type: string
          format: date
          description: Local calendar date used for intake records
        as_of:
          type: string
          description: Timestamp used for cumulative intake and schedule projection (YYYY-MM-DDTHH:MM:SS in configured timezone)
        on_track:
          type: boolean
          nullable: true
          description: True when direct liquid intake meets or exceeds schedule expectation; false when behind; null when no liquid schedule
        intake:
          $ref: '#/components/schemas/NutritionStatusIntake'
        schedule:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/NutritionStatusSchedule'
      required:
        - pet_id
        - local_date
        - as_of
        - on_track
        - intake

    NutritionStatusIntake:
      type: object
      properties:
        liquids_ml:
          type: number
          format: double
          description: Cumulative `liquids` category intake as of the timestamp
        water_ml:
          type: number
          format: double
          description: Cumulative `water` category intake as of the timestamp
        direct_liquid_ml:
          type: number
          format: double
          description: Cumulative direct liquid intake (`liquids` + `water`), comparable to the liquid schedule
        wet_food_g:
          type: number
          format: double
          description: Cumulative wet food intake in grams
        wet_food_fluid_ml:
          type: number
          format: double
          description: Estimated fluid from wet food (wet_food_g × 0.77, rounded)
        dry_food_g:
          type: number
          format: double
          description: Cumulative dry food intake in grams
        total_known_fluid_ml:
          type: number
          format: double
          description: Total known fluid (direct liquid + wet food fluid)
      required:
        - liquids_ml
        - water_ml
        - direct_liquid_ml
        - wet_food_g
        - wet_food_fluid_ml
        - dry_food_g
        - total_known_fluid_ml

    NutritionStatusSchedule:
      type: object
      properties:
        schedule_id:
          type: string
          description: Active liquid schedule ID
        schedule_name:
          type: string
          description: Active liquid schedule name
        expected_ml:
          type: number
          format: double
          description: Cumulative schedule expectation as of the timestamp (sum of window max values whose midpoint has passed)
        daily_min_ml:
          type: number
          format: double
          description: Sum of all window min values for the day
        daily_max_ml:
          type: number
          format: double
          description: Sum of all window max values for the day
        delta_ml:
          type: number
          format: double
          description: direct_liquid_ml minus expected_ml
      required:
        - schedule_id
        - schedule_name
        - expected_ml
        - daily_min_ml
        - daily_max_ml
        - delta_ml
      required:
        - local_date
        - records
        - totals_by_category

