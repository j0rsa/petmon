components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        Bearer authentication with either:
        - OIDC JWT token (format: standard JWT)
        - API token with `pm_api_` prefix (format: pm_api_<token>)

  responses:
    BadRequest:
      description: Invalid request parameters or body
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Unauthorized:
      description: Authentication required or invalid credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: Error message
      required:
        - error

    AuthMode:
      type: string
      enum:
        - dev
        - oidc
        - unconfigured
      description: Current authentication mode

    AuthInfo:
      type: object
      properties:
        mode:
          $ref: '#/components/schemas/AuthMode'
        authorization_endpoint:
          type: string
          nullable: true
          description: OAuth2 authorization endpoint URL
        client_id:
          type: string
          nullable: true
          description: OAuth2 client ID for the frontend
        token_endpoint:
          type: string
          nullable: true
          description: OAuth2 token endpoint URL
      required:
        - mode

    MeResponse:
      type: object
      properties:
        subject:
          type: string
          description: User subject identifier
        email:
          type: string
          nullable: true
          description: User email address
        name:
          type: string
          nullable: true
          description: User full name
        display_name:
          type: string
          description: Display name (name or email or subject)
        kind:
          type: string
          enum:
            - oidc
            - api_token
            - dev
          description: Authentication method used
      required:
        - subject
        - display_name
        - kind

    PetSpecies:
      type: string
      enum:
        - cat
        - dog
        - bunny
        - parrot
        - other
      description: Pet species

    PetStatus:
      type: string
      enum:
        - active
        - archived
      description: Pet status

    Pet:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Pet UUID
        name:
          type: string
          description: Pet name
        species:
          $ref: '#/components/schemas/PetSpecies'
        status:
          $ref: '#/components/schemas/PetStatus'
        breed:
          type: string
          nullable: true
          description: Pet breed
        birth_date:
          type: string
          nullable: true
          description: Pet birth date (YYYY-MM-DD)
        blood_type:
          type: string
          nullable: true
          description: Pet blood type
        color:
          type: string
          nullable: true
          description: Pet color/markings
        feeding_notes:
          type: string
          nullable: true
          description: Feeding instructions and notes
        telegram_chat_id:
          type: string
          nullable: true
          description: Telegram chat ID for notifications
        telegram_thread_id:
          type: string
          nullable: true
          description: Telegram thread ID for topic replies
        created_at:
          type: string
          format: date-time
          description: Record creation timestamp (RFC3339)
        updated_at:
          type: string
          format: date-time
          description: Record last update timestamp (RFC3339)
      required:
        - id
        - name
        - species
        - status
        - created_at
        - updated_at

    CreatePet:
      type: object
      properties:
        name:
          type: string
          description: Pet name
        species:
          $ref: '#/components/schemas/PetSpecies'
        status:
          $ref: '#/components/schemas/PetStatus'
        breed:
          type: string
          nullable: true
        birth_date:
          type: string
          nullable: true
          format: date
        blood_type:
          type: string
          nullable: true
        color:
          type: string
          nullable: true
        feeding_notes:
          type: string
          nullable: true
        telegram_chat_id:
          type: string
          nullable: true
        telegram_thread_id:
          type: string
          nullable: true
      required:
        - name

    UpdatePet:
      type: object
      properties:
        name:
          type: string
          nullable: true
        species:
          $ref: '#/components/schemas/PetSpecies'
        status:
          $ref: '#/components/schemas/PetStatus'
        breed:
          type: string
          nullable: true
        birth_date:
          type: string
          nullable: true
          format: date
        blood_type:
          type: string
          nullable: true
        color:
          type: string
          nullable: true
        feeding_notes:
          type: string
          nullable: true
        telegram_chat_id:
          type: string
          nullable: true
        telegram_thread_id:
          type: string
          nullable: true

    DayNote:
      type: object
      properties:
        date:
          type: string
          format: date
          description: Date of the note
        pet_id:
          type: string
          format: uuid
          nullable: true
          description: Associated pet UUID, if any
        note:
          type: string
          description: Note text
      required:
        - date
        - note

    NutritionCategory:
      type: string
      enum:
        - wet_food
        - dry_food
        - water
        - liquids
      description: Category of nutrition intake

    NutritionRecord:
      type: object
      properties:
        id:
          type: string
          description: Record ID
        pet_id:
          type: string
          format: uuid
          description: Pet UUID
        occurred_at:
          type: string
          format: date-time
          description: When the intake occurred (RFC3339)
        local_date:
          type: string
          format: date
          description: Local date of the occurrence
        category:
          $ref: '#/components/schemas/NutritionCategory'
        amount:
          type: number
          format: double
          description: Amount consumed
        unit:
          type: string
          nullable: true
          description: Unit of measurement (ml, g, etc.)
        source_type:
          type: string
          description: Source of the record (e.g., manual, telegram)
        created_at:
          type: string
          format: date-time
          description: Record creation timestamp (RFC3339)
        updated_at:
          type: string
          format: date-time
          description: Record last update timestamp (RFC3339)
      required:
        - id
        - pet_id
        - occurred_at
        - local_date
        - category
        - amount
        - source_type
        - created_at
        - updated_at

    CreateNutritionRecord:
      type: object
      properties:
        pet_id:
          type: string
          format: uuid
          description: Pet UUID
        occurred_at:
          type: string
          format: date-time
          description: When the intake occurred (RFC3339)
        local_date:
          type: string
          format: date
          nullable: true
          description: Local date (auto-derived if not provided)
        category:
          $ref: '#/components/schemas/NutritionCategory'
        amount:
          type: number
          format: double
          description: Amount consumed
        unit:
          type: string
          nullable: true
          description: Unit of measurement
        source_type:
          type: string
          nullable: true
          description: Source of the record (defaults to manual)
      required:
        - pet_id
        - occurred_at
        - category
        - amount

    UpdateNutritionRecord:
      type: object
      properties:
        occurred_at:
          type: string
          format: date-time
          nullable: true
        local_date:
          type: string
          format: date
          nullable: true
        category:
          $ref: '#/components/schemas/NutritionCategory'
        amount:
          type: number
          format: double
          nullable: true
        unit:
          type: string
          nullable: true

    NutritionScheduleRule:
      type: object
      properties:
        category:
          type: string
          description: Nutrition category
        target_amount:
          type: number
          format: double
          description: Target amount
        unit:
          type: string
          nullable: true
          description: Unit of measurement
        time_of_day:
          type: string
          nullable: true
          description: Recommended time (e.g., HH:MM)
        notes:
          type: string
          nullable: true
          description: Additional notes

    NutritionSchedule:
      type: object
      properties:
        id:
          type: string
          description: Schedule ID
        pet_id:
          type: string
          format: uuid
          description: Pet UUID
        name:
          type: string
          description: Schedule name
        active:
          type: boolean
          description: Whether the schedule is active
        rules_json:
          type: string
          description: JSON-serialized array of NutritionScheduleRule objects
        created_at:
          type: string
          format: date-time
          description: Record creation timestamp (RFC3339)
        updated_at:
          type: string
          format: date-time
          description: Record last update timestamp (RFC3339)
      required:
        - id
        - pet_id
        - name
        - active
        - rules_json
        - created_at
        - updated_at

    CreateNutritionSchedule:
      type: object
      properties:
        pet_id:
          type: string
          format: uuid
          description: Pet UUID
        name:
          type: string
          description: Schedule name
        active:
          type: boolean
          nullable: true
          description: Active status (defaults to true)
        rules:
          type: array
          nullable: true
          description: Array of schedule rules
          items:
            $ref: '#/components/schemas/NutritionScheduleRule'
      required:
        - pet_id
        - name

    UpdateNutritionSchedule:
      type: object
      properties:
        name:
          type: string
          nullable: true
        active:
          type: boolean
          nullable: true
        rules:
          type: array
          nullable: true
          description: Array of schedule rules
          items:
            $ref: '#/components/schemas/NutritionScheduleRule'

    NutritionDailyTotal:
      type: object
      properties:
        local_date:
          type: string
          format: date
          description: Date of the totals
        pet_id:
          type: string
          format: uuid
          description: Pet UUID
        category:
          type: string
          description: Nutrition category
        total_amount:
          type: number
          format: double
          description: Total amount for the day
        record_count:
          type: integer
          format: int64
          description: Number of records contributing to this total
      required:
        - local_date
        - pet_id
        - category
        - total_amount
        - record_count

    NutritionDaySummary:
      type: object
      properties:
        local_date:
          type: string
          format: date
          description: Date of the summary
        pet_id:
          type: string
          format: uuid
          nullable: true
          description: Pet UUID (if filtered)
        records:
          type: array
          items:
            $ref: '#/components/schemas/NutritionRecord'
          description: Nutrition records for the day
        totals_by_category:
          type: object
          additionalProperties:
            type: number
            format: double
          description: Total amounts by category
        note:
          type: string
          nullable: true
          description: Optional day note
      required:
        - local_date
        - records
        - totals_by_category

    FluidCurvePoint:
      type: object
      properties:
        time:
          type: string
          description: Time of day (HH:MM format, date-independent)
        cumulative_fluid_ml:
          type: number
          format: double
          description: Cumulative total fluid (liquids + wet food moisture) up to this time
        cumulative_liquids_ml:
          type: number
          format: double
          description: Cumulative direct liquid intake (water + liquids categories only) up to this time
      required:
        - time
        - cumulative_fluid_ml
        - cumulative_liquids_ml

    BestFluidDay:
      type: object
      properties:
        local_date:
          type: string
          format: date
          description: Date of the best fluid day
        total_fluid_ml:
          type: number
          format: double
          description: Total fluid intake on that day
        curve:
          type: array
          items:
            $ref: '#/components/schemas/FluidCurvePoint'
          description: Cumulative fluid curve for visualization
      required:
        - local_date
        - total_fluid_ml
        - curve

    NutritionRangeSummary:
      type: object
      properties:
        date_from:
          type: string
          format: date
          description: Start date of the range
        date_to:
          type: string
          format: date
          description: End date of the range
        pet_id:
          type: string
          format: uuid
          nullable: true
          description: Pet UUID (if filtered)
        daily_totals:
          type: array
          items:
            $ref: '#/components/schemas/NutritionDailyTotal'
          description: Daily totals for the date range
        category_averages:
          type: object
          additionalProperties:
            type: number
            format: double
          description: Average daily amounts by category
      required:
        - date_from
        - date_to
        - daily_totals
        - category_averages

    TimeFormat:
      type: string
      enum:
        - h24
        - h12
      description: Time display format

    DateFormat:
      type: string
      enum:
        - dmy
        - mmm_dd_yyyy
      description: "Date display format: DD.MM.YYYY or MMM DD, YYYY"

    WeekStart:
      type: string
      enum:
        - sunday
        - monday
      description: First day of the week for calendar display

    DisplaySettings:
      type: object
      properties:
        time_format:
          $ref: '#/components/schemas/TimeFormat'
        date_format:
          $ref: '#/components/schemas/DateFormat'
        show_water_card:
          type: boolean
          description: Whether to show the water metric card on the day panel
        calendar_show_wet_food:
          type: boolean
        calendar_show_liquids:
          type: boolean
        calendar_show_water:
          type: boolean
        calendar_show_dry_food:
          type: boolean
        calendar_show_record_count:
          type: boolean
        calendar_show_total_fluid:
          type: boolean
        calendar_week_start:
          $ref: '#/components/schemas/WeekStart'
      required:
        - time_format
        - date_format
        - show_water_card
        - calendar_show_wet_food
        - calendar_show_liquids
        - calendar_show_water
        - calendar_show_dry_food
        - calendar_show_record_count
        - calendar_show_total_fluid
        - calendar_week_start

    UpdateDisplaySettings:
      type: object
      properties:
        time_format:
          $ref: '#/components/schemas/TimeFormat'
        date_format:
          $ref: '#/components/schemas/DateFormat'
        show_water_card:
          type: boolean
          nullable: true
        calendar_show_wet_food:
          type: boolean
          nullable: true
        calendar_show_liquids:
          type: boolean
          nullable: true
        calendar_show_water:
          type: boolean
          nullable: true
        calendar_show_dry_food:
          type: boolean
          nullable: true
        calendar_show_record_count:
          type: boolean
          nullable: true
        calendar_show_total_fluid:
          type: boolean
          nullable: true
        calendar_week_start:
          $ref: '#/components/schemas/WeekStart'

    OidcConfigPublic:
      type: object
      properties:
        enabled:
          type: boolean
          description: Whether OIDC authentication is enabled
        issuer_url:
          type: string
          nullable: true
          description: OIDC issuer URL
        client_id:
          type: string
          nullable: true
          description: OAuth2 client ID (used by the frontend for PKCE flow)
      required:
        - enabled

    UpdateOidcConfig:
      type: object
      properties:
        enabled:
          type: boolean
          nullable: true
        issuer_url:
          type: string
          nullable: true
        client_id:
          type: string
          nullable: true

    TelegramConfigPublic:
      type: object
      properties:
        enabled:
          type: boolean
          description: Whether Telegram integration is enabled
        has_bot_token:
          type: boolean
          description: Whether a bot token is configured
      required:
        - enabled
        - has_bot_token

    UpdateTelegramConfig:
      type: object
      properties:
        enabled:
          type: boolean
          nullable: true
        bot_token:
          type: string
          nullable: true
          description: If omitted, the stored value is preserved

    ApiTokenPublic:
      type: object
      properties:
        id:
          type: string
          description: Token ID
        alias:
          type: string
          nullable: true
          description: Human-readable alias for the token
        active:
          type: boolean
          description: Whether the token is active
        current:
          type: boolean
          description: Whether this token is authenticating the current request
        created_by:
          type: string
          nullable: true
          description: User who created the token
        created_at:
          type: string
          format: date-time
          description: Token creation timestamp (RFC3339)
        last_used_at:
          type: string
          format: date-time
          nullable: true
          description: Last usage timestamp (RFC3339)
      required:
        - id
        - active
        - current
        - created_at

    ApiTokenCreated:
      type: object
      properties:
        id:
          type: string
          description: Token ID
        alias:
          type: string
          nullable: true
          description: Token alias
        token:
          type: string
          description: Raw token value (only shown at creation)
        created_at:
          type: string
          format: date-time
          description: Token creation timestamp (RFC3339)
      required:
        - id
        - token
        - created_at

    CreateApiToken:
      type: object
      properties:
        alias:
          type: string
          nullable: true
          description: Human-readable alias for the token

    EliminationEventType:
      type: string
      enum:
        - general
        - urination
        - defecation
        - vomit
      description: "Type of elimination event. Subtypes for defecation: normal|soft|liquid|hard|blood|mucus. Subtypes for vomit: food|fur|fur_with_food|bile|other."

    EliminationRecord:
      type: object
      properties:
        id:
          type: string
        pet_id:
          type: string
          format: uuid
        occurred_at:
          type: string
          format: date-time
          description: Naive local datetime (RFC3339, no Z suffix)
        local_date:
          type: string
          format: date
        event_type:
          $ref: '#/components/schemas/EliminationEventType'
        subtype:
          type: string
          nullable: true
          description: Event-specific subtype (defecation or vomit only)
        duration_seconds:
          type: integer
          nullable: true
          description: Time spent in seconds (optional)
        note:
          type: string
          nullable: true
        source_type:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - pet_id
        - occurred_at
        - local_date
        - event_type
        - source_type
        - created_at
        - updated_at

    CreateEliminationRecord:
      type: object
      properties:
        pet_id:
          type: string
          format: uuid
        event_type:
          $ref: '#/components/schemas/EliminationEventType'
        occurred_at:
          type: string
          format: date-time
          nullable: true
        local_date:
          type: string
          format: date
          nullable: true
        subtype:
          type: string
          nullable: true
        duration_seconds:
          type: integer
          nullable: true
        note:
          type: string
          nullable: true
        source_type:
          type: string
          nullable: true
      required:
        - pet_id
        - event_type

    CreateEliminationWithWeight:
      type: object
      description: >
        Create a toileting event and a weight measurement in one request.
        Both records are stamped with the same resolved occurred_at timestamp.
      properties:
        pet_id:
          type: string
          format: uuid
        event_type:
          allOf:
            - $ref: '#/components/schemas/EliminationEventType'
          nullable: true
          description: Defaults to general when omitted.
        occurred_at:
          type: string
          format: date-time
          nullable: true
          description: Naive local datetime YYYY-MM-DDTHH:MM:SS. Defaults to now in configured timezone.
        local_date:
          type: string
          format: date
          nullable: true
        subtype:
          type: string
          nullable: true
        duration_seconds:
          type: integer
          nullable: true
        note:
          type: string
          nullable: true
          description: Note for the elimination record
        source_type:
          type: string
          nullable: true
        weight_kg:
          type: number
          format: double
          description: Weight measurement in kilograms
        weight_note:
          type: string
          nullable: true
          description: Note for the weight record
      required:
        - pet_id
        - weight_kg

    EliminationWithWeightCreated:
      type: object
      properties:
        elimination:
          $ref: '#/components/schemas/EliminationRecord'
        weight:
          $ref: '#/components/schemas/WeightRecord'
      required:
        - elimination
        - weight

    UpdateEliminationRecord:
      type: object
      properties:
        event_type:
          $ref: '#/components/schemas/EliminationEventType'
        occurred_at:
          type: string
          format: date-time
          nullable: true
        local_date:
          type: string
          format: date
          nullable: true
        subtype:
          type: string
          nullable: true
        duration_seconds:
          type: integer
          nullable: true
        note:
          type: string
          nullable: true

    EliminationDailySummary:
      type: object
      properties:
        local_date:
          type: string
          format: date
        pet_id:
          type: string
          format: uuid
          nullable: true
        total_count:
          type: integer
          format: int64
        urination_count:
          type: integer
          format: int64
        defecation_count:
          type: integer
          format: int64
        vomit_count:
          type: integer
          format: int64
        general_count:
          type: integer
          format: int64
        has_vomit:
          type: boolean
        avg_duration_seconds:
          type: number
          format: double
          nullable: true
          description: Average session duration in seconds for records that have duration logged; null if none.
      required:
        - local_date
        - total_count
        - urination_count
        - defecation_count
        - vomit_count
        - general_count
        - has_vomit

    EliminationRangeSummary:
      type: object
      properties:
        date_from:
          type: string
          format: date
        date_to:
          type: string
          format: date
        pet_id:
          type: string
          format: uuid
          nullable: true
        daily_summaries:
          type: array
          items:
            $ref: '#/components/schemas/EliminationDailySummary'
        type_totals:
          type: object
          additionalProperties:
            type: integer
            format: int64
        avg_per_day:
          type: number
          format: double
        p50_per_day:
          type: number
          format: double
        p90_per_day:
          type: number
          format: double
        p99_per_day:
          type: number
          format: double
      required:
        - date_from
        - date_to
        - daily_summaries
        - type_totals
        - avg_per_day
        - p50_per_day
        - p90_per_day
        - p99_per_day

    WeightRecord:
      type: object
      properties:
        id:
          type: string
        pet_id:
          type: string
          format: uuid
        measured_at:
          type: string
          format: date-time
          description: Naive local datetime (RFC3339, no Z suffix)
        local_date:
          type: string
          format: date
        weight_kg:
          type: number
          format: double
        note:
          type: string
          nullable: true
        source_type:
          type: string
        created_at:
          type: string
          format: date-time
      required:
        - id
        - pet_id
        - measured_at
        - local_date
        - weight_kg
        - source_type
        - created_at

    CreateWeightRecord:
      type: object
      properties:
        pet_id:
          type: string
          format: uuid
        weight_kg:
          type: number
          format: double
        measured_at:
          type: string
          format: date-time
          nullable: true
        local_date:
          type: string
          format: date
          nullable: true
        note:
          type: string
          nullable: true
        source_type:
          type: string
          nullable: true
      required:
        - pet_id
        - weight_kg

    WeightSummaryBucket:
      type: object
      description: Aggregated weight data for a time bucket
      required: [bucket, avg_kg, min_kg, max_kg, count]
      properties:
        bucket:
          type: string
          description: Bucket identifier — ISO datetime for raw, YYYY-MM-DD for daily/weekly
        avg_kg:
          type: number
          format: double
        min_kg:
          type: number
          format: double
        max_kg:
          type: number
          format: double
        count:
          type: integer
          format: int64

    WeightStats:
      type: object
      properties:
        latest_kg:
          type: number
          format: double
          nullable: true
          description: Most recent weight measurement for the pet
        latest_date:
          type: string
          format: date
          nullable: true
          description: Date of the most recent measurement
        avg_kg:
          type: number
          format: double
          nullable: true
          description: Average weight within the requested date window
        count:
          type: integer
          format: int64
          description: Number of measurements within the date window
      required:
        - count

