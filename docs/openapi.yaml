    UpdateMedication:
      type: object
      properties:
        name: { type: string }
        color: { type: string }

    MedFormulation:
      type: object
      properties:
        id: { type: string }
        medication_id: { type: string }
        tablet_strength_mg: { type: number, nullable: true }
        pill_shape: { $ref: '#/components/schemas/PillShape', nullable: true }
        liquid_concentration_mg_per_ml: { type: number, nullable: true }
        created_at: { type: string, format: date-time }
      required: [id, medication_id, created_at]

    MedAssignment:
      type: object
      properties:
        id: { type: string }
        medication_id: { type: string }
        pet_id: { type: string, format: uuid }
        formulation_id: { type: string }
        formulation: { $ref: '#/components/schemas/MedFormulation' }
        dose_fraction: { $ref: '#/components/schemas/DoseFraction', nullable: true }
        liquid_dose_ml: { type: number, nullable: true }
        effective_dose_mg: { type: number, nullable: true }
        dose_label: { type: string }
        frequency: { $ref: '#/components/schemas/MedFrequency' }
        date_from: { type: string, format: date }
        date_to: { type: string, format: date, nullable: true }
        optional: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
      required: [id, medication_id, pet_id, formulation_id, formulation, dose_label, frequency, date_from, optional, created_at, updated_at]

    CreateMedAssignment:
      type: object
      properties:
        medication_id: { type: string }
        formulation_id: { type: string }
        tablet_strength_mg: { type: number }
        pill_shape: { $ref: '#/components/schemas/PillShape' }
        liquid_concentration_mg_per_ml: { type: number }
        dose_fraction: { $ref: '#/components/schemas/DoseFraction' }
        liquid_dose_ml: { type: number }
        frequency: { $ref: '#/components/schemas/MedFrequency' }
        date_from: { type: string, format: date }
        date_to: { type: string, format: date, nullable: true }
        optional: { type: boolean }
      required: [medication_id, date_from]

    ReviseMedAssignment:
      type: object
      properties:
        formulation_id: { type: string }
        tablet_strength_mg: { type: number }
        pill_shape: { $ref: '#/components/schemas/PillShape' }
        liquid_concentration_mg_per_ml: { type: number }
        dose_fraction: { $ref: '#/components/schemas/DoseFraction' }
        liquid_dose_ml: { type: number }
        frequency: { $ref: '#/components/schemas/MedFrequency' }
        effective_from: { type: string, format: date }
        date_to: { type: string, format: date, nullable: true }
        optional: { type: boolean }
      required: [effective_from]

    MedIntakeRecord:
      type: object
      properties:
        id: { type: string }
        pet_id: { type: string, format: uuid }
        medication_id: { type: string }
        assignment_id: { type: string }
        assignment: { $ref: '#/components/schemas/MedAssignment' }
        dose_fraction_override: { $ref: '#/components/schemas/DoseFraction', nullable: true }
        liquid_dose_ml_override: { type: number, nullable: true }
        effective_dose_fraction: { $ref: '#/components/schemas/DoseFraction', nullable: true }
        effective_dose_mg: { type: number, nullable: true }
        dose_label: { type: string }
        occurred_at: { type: string }
        local_date: { type: string, format: date }
        taken: { type: boolean }
        note: { type: string, nullable: true }
        source_type: { type: string }
        created_at: { type: string, format: date-time }
      required: [id, pet_id, medication_id, assignment_id, assignment, dose_label, occurred_at, local_date, taken, source_type, created_at]

    CreateMedIntakeRecord:
      type: object
      properties:
        pet_id: { type: string, format: uuid }
        medication_id: { type: string }
        assignment_id: { type: string }
        dose_fraction_override: { $ref: '#/components/schemas/DoseFraction' }
        liquid_dose_ml_override: { type: number }
        taken: { type: boolean }
